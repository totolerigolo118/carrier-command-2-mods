<script>
const SRC = {"origine": ["\n\nin vec3 vertex_position_in;\nin vec2 vertex_coord_0_in;\n\nout vec2 vertex_coord_0_out;\nout float fragment_distance_out;\nout float logz;\n\nuniform mat4 mat_view;\nuniform mat4 mat_proj;\nuniform mat4 mat_world;\n\nvoid main()\n{\n\tvertex_coord_0_out = vertex_coord_0_in;\n\n\tvec4 view_pos = mat_view * mat_world * vec4(vertex_position_in, 1);\n\tfragment_distance_out = -view_pos.z;\n\n\tgl_Position = mat_proj * view_pos;\n\tlogz = 1.0 + gl_Position.w;\n}\n\n", "\n\nin vec2 vertex_coord_0_out;\nin float fragment_distance_out;\nin float logz;\n\nout vec4 color_out;\n\nuniform vec3 object_color;\nuniform sampler2D texture_color;\nuniform sampler2D texture_noise;\nuniform vec2 screen_resolution;\nuniform float animation_time;\nuniform float animation_rand;\nuniform float screen_brightness;\nuniform float far_plane_coefficient;\nuniform float warp_factor;\nuniform float screen_warp_power;\nuniform float screen_warp_intensity;\nuniform float crt_effect_factor;\n\nvoid main()\n{\n\tvec2 pixel_size = vec2(1.0 / screen_resolution.x, 1.0 / screen_resolution.y);\n\n\tconst float pi = 3.14159265359;\n\n\t// warp vertex coords at edges of screen\n\tfloat warp_intensity = screen_warp_intensity * warp_factor;\n\tfloat vignette_x = pow(abs(sin(vertex_coord_0_out.x * pi)), screen_warp_power);\n\tfloat vignette_y = pow(abs(sin(vertex_coord_0_out.y * pi)), screen_warp_power);\n\tfloat vignette_factor = mix(1.0, vignette_x * vignette_y, crt_effect_factor);\n\tvec2 warped_vertex_coord = mix(vertex_coord_0_out, vec2(0.5), vignette_factor * warp_intensity);\n\n\t// scanlines\n\tfloat scanline_brightness = sin(animation_time * 5.0 + warped_vertex_coord.y * 50.0) * 0.5 + 0.5;\n\n\t// offset color samples for chromatic aberration\n\tfloat aberration_factor = 1.0 * crt_effect_factor;\n\tfloat uv_shift = (pixel_size.x * 0.3) * aberration_factor;\t\n\n\tvec2 coord_r = vec2(clamp(warped_vertex_coord.x - uv_shift, 0.0, 1.0), warped_vertex_coord.y);\n\tvec2 coord_g = vec2(warped_vertex_coord.x, warped_vertex_coord.y);\n\tvec2 coord_b = vec2(clamp(warped_vertex_coord.x + uv_shift, 0.0, 1.0), warped_vertex_coord.y);\n\n\tvec2 noise_to_pixel_scale = screen_resolution / vec2(256.0);\n\tfloat noise_sample = texture(texture_noise, (warped_vertex_coord + vec2(animation_rand)) * noise_to_pixel_scale).r;\n\tfloat noise_sample_2 = texture(texture_noise, ((warped_vertex_coord + vec2(animation_rand)) * 10.0) * noise_to_pixel_scale).r;\n\n\tfloat color_noise_amount = 0.0005 * crt_effect_factor;\n\tvec2 coord_noise_offset = vec2(noise_sample_2 * color_noise_amount);\n\tfloat color_sample_r = texture(texture_color, coord_r + coord_noise_offset).r;\n\tfloat color_sample_g = texture(texture_color, coord_g + coord_noise_offset).g;\n\tfloat color_sample_b = texture(texture_color, coord_b + coord_noise_offset).b;\n\tfloat color_sample_a = texture(texture_color, coord_g + coord_noise_offset).a;\n\n\tvec3 backlight_color = vec3(0.02, 0.025, 0.04) * 5.0 * crt_effect_factor;\n\n\tcolor_sample_r = mix(backlight_color.r, 1.0, color_sample_r);\n\tcolor_sample_g = mix(backlight_color.g, 1.0, color_sample_g);\n\tcolor_sample_b = mix(backlight_color.b, 1.0, color_sample_b);\n\n\tvec3 color_sample = vec3(color_sample_r, color_sample_g, color_sample_b);\n\n\t// combine effects\n\tcolor_sample = color_sample * object_color * screen_brightness;\n\tcolor_out = vec4(color_sample, color_sample_a);\n\tcolor_out += vec4(noise_sample) * (0.025 + 0.025 * scanline_brightness);\n\n\t// rounded edges\n\tif(vignette_factor < 0.2)\n\t{\n\t\tcolor_out = vec4(0.0, 0.0, 0.0, 1.0);\n\t}\n\telse\n\t{\n\t\tcolor_out = mix(color_out, vec4(0.0, 0.0, 0.0, 1.0), 1.0 - pow(max(vignette_factor - 0.2, 0.0), 0.2));\n\t}\n\n\tgl_FragDepth = log2(logz) * far_plane_coefficient;\n}"], "effet_tele": ["\n\nin vec3 vertex_position_in;\nin vec2 vertex_coord_0_in;\n\nout vec2 vertex_coord_0_out;\nout float fragment_distance_out;\nout float logz;\n\nuniform mat4 mat_view;\nuniform mat4 mat_proj;\nuniform mat4 mat_world;\n\nvoid main()\n{\n\tvertex_coord_0_out = vertex_coord_0_in;\n\n\tvec4 view_pos = mat_view * mat_world * vec4(vertex_position_in, 1);\n\tfragment_distance_out = -view_pos.z;\n\n\tgl_Position = mat_proj * view_pos;\n\tlogz = 1.0 + gl_Position.w;\n}\n\n", "\n\nin vec2 vertex_coord_0_out;\nin float fragment_distance_out;\nin float logz;\n\nout vec4 color_out;\n\nuniform vec3 object_color;\nuniform sampler2D texture_color;\nuniform sampler2D texture_noise;\nuniform vec2 screen_resolution;\nuniform float animation_time;\nuniform float animation_rand;\nuniform float screen_brightness;\nuniform float far_plane_coefficient;\nuniform float warp_factor;\nuniform float screen_warp_power;\nuniform float screen_warp_intensity;\nuniform float crt_effect_factor;\n\n// calcul d'origine de l'effet vieille tele (inchange, garde pour que tous les uniforms restent actifs)\nvec4 effet_origine()\n{\n\tvec4 c = vec4(0.0);\n\tvec2 pixel_size = vec2(1.0 / screen_resolution.x, 1.0 / screen_resolution.y);\n\n\tconst float pi = 3.14159265359;\n\n\t// warp vertex coords at edges of screen\n\tfloat warp_intensity = screen_warp_intensity * warp_factor;\n\tfloat vignette_x = pow(abs(sin(vertex_coord_0_out.x * pi)), screen_warp_power);\n\tfloat vignette_y = pow(abs(sin(vertex_coord_0_out.y * pi)), screen_warp_power);\n\tfloat vignette_factor = mix(1.0, vignette_x * vignette_y, crt_effect_factor);\n\tvec2 warped_vertex_coord = mix(vertex_coord_0_out, vec2(0.5), vignette_factor * warp_intensity);\n\n\t// scanlines\n\tfloat scanline_brightness = sin(animation_time * 5.0 + warped_vertex_coord.y * 50.0) * 0.5 + 0.5;\n\n\t// offset color samples for chromatic aberration\n\tfloat aberration_factor = 1.0 * crt_effect_factor;\n\tfloat uv_shift = (pixel_size.x * 0.3) * aberration_factor;\t\n\n\tvec2 coord_r = vec2(clamp(warped_vertex_coord.x - uv_shift, 0.0, 1.0), warped_vertex_coord.y);\n\tvec2 coord_g = vec2(warped_vertex_coord.x, warped_vertex_coord.y);\n\tvec2 coord_b = vec2(clamp(warped_vertex_coord.x + uv_shift, 0.0, 1.0), warped_vertex_coord.y);\n\n\tvec2 noise_to_pixel_scale = screen_resolution / vec2(256.0);\n\tfloat noise_sample = texture(texture_noise, (warped_vertex_coord + vec2(animation_rand)) * noise_to_pixel_scale).r;\n\tfloat noise_sample_2 = texture(texture_noise, ((warped_vertex_coord + vec2(animation_rand)) * 10.0) * noise_to_pixel_scale).r;\n\n\tfloat color_noise_amount = 0.0005 * crt_effect_factor;\n\tvec2 coord_noise_offset = vec2(noise_sample_2 * color_noise_amount);\n\tfloat color_sample_r = texture(texture_color, coord_r + coord_noise_offset).r;\n\tfloat color_sample_g = texture(texture_color, coord_g + coord_noise_offset).g;\n\tfloat color_sample_b = texture(texture_color, coord_b + coord_noise_offset).b;\n\tfloat color_sample_a = texture(texture_color, coord_g + coord_noise_offset).a;\n\n\tvec3 backlight_color = vec3(0.02, 0.025, 0.04) * 5.0 * crt_effect_factor;\n\n\tcolor_sample_r = mix(backlight_color.r, 1.0, color_sample_r);\n\tcolor_sample_g = mix(backlight_color.g, 1.0, color_sample_g);\n\tcolor_sample_b = mix(backlight_color.b, 1.0, color_sample_b);\n\n\tvec3 color_sample = vec3(color_sample_r, color_sample_g, color_sample_b);\n\n\t// combine effects\n\tcolor_sample = color_sample * object_color * screen_brightness;\n\tc = vec4(color_sample, color_sample_a);\n\tc += vec4(noise_sample) * (0.025 + 0.025 * scanline_brightness);\n\n\t// rounded edges\n\tif(vignette_factor < 0.2)\n\t{\n\t\tc = vec4(0.0, 0.0, 0.0, 1.0);\n\t}\n\telse\n\t{\n\t\tc = mix(c, vec4(0.0, 0.0, 0.0, 1.0), 1.0 - pow(max(vignette_factor - 0.2, 0.0), 0.2));\n\t}\n\treturn c;\n}\n\nvoid main()\n{\n\t// MODULE \"effet_tele\" de l'atelier de patchs CC2 (23/10/2026) : interface de pilotage SANS effet\n\t// vieille tele (ni deformation, ni lignes, ni grain, ni bavure de couleurs, ni bords assombris).\n\t// L'image de l'interface est posee telle quelle. Le calcul d'origine pese 0 : son poids depend\n\t// d'animation_time et ne vaut 1 qu'au-dela de 1e30 secondes, ce qui n'arrive jamais.\n\tvec4 color_sample = texture(texture_color, vertex_coord_0_out);\n\tvec4 net = vec4(color_sample.rgb * object_color * screen_brightness, color_sample.a);\n\tfloat poids = step(1.0e30, animation_time);\n\tcolor_out = mix(net, effet_origine(), poids);\n\tgl_FragDepth = log2(logz) * far_plane_coefficient;\n}"]};
const out = [];
const gl = document.createElement('canvas').getContext('webgl2');
function prog(v, f) {
  const p = gl.createProgram(), log = [];
  for (const [t, s] of [[gl.VERTEX_SHADER, v], [gl.FRAGMENT_SHADER, f]]) {
    const sh = gl.createShader(t); gl.shaderSource(sh, '#version 300 es\nprecision highp float;\n' + s); gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) log.push(gl.getShaderInfoLog(sh));
    gl.attachShader(p, sh);
  }
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) log.push(gl.getProgramInfoLog(p));
  return [p, log];
}
const noms = ['object_color','texture_color','texture_noise','screen_resolution','animation_time','animation_rand','screen_brightness','far_plane_coefficient','warp_factor','screen_warp_power','screen_warp_intensity','crt_effect_factor','mat_view','mat_proj','mat_world'];
for (const [nom, [v, f]] of Object.entries(SRC)) {
  const [p, log] = prog(v, f);
  const actifs = noms.filter(n => gl.getUniformLocation(p, n) !== null);
  out.push(nom + ' : ' + (log.length ? 'ERREUR\n' + log.join('\n') : 'compile OK') + ' | uniforms actifs ' + actifs.length + '/' + noms.length + (actifs.length < noms.length ? ' (manquants : ' + noms.filter(n => !actifs.includes(n)).join(', ') + ')' : ''));
}
